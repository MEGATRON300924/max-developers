name: Dependency lockfile and security updates

on:
  push:
    branches:
      - security/max-developers-audit-2026-10-12

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/max-developers-audit-2026-10-12
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade Next.js to the patched release
        run: npm install next@16.4.0 --save-exact --no-audit --no-fund
      - name: Generate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix || true
      - name: Reinstall exactly from the updated lockfile
        run: npm ci
      - name: Check for critical dependency vulnerabilities
        run: npm audit --audit-level=critical
      - name: Check production dependencies for high-risk advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Build application
        run: npm run build
      - name: Report remaining advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({vulnerabilities:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): patch Next.js security advisories and lock dependencies"
          git push origin HEAD:security/max-developers-audit-2026-10-12
